<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2545" />
    <meta name="description" content="Masar Services — home and facility maintenance in Saudi Arabia." />
    <title>Masar Services | مسار للخدمات</title>
    <script>
      // Apply the saved language before first paint to avoid a direction flash.
      // Must stay in sync with STORAGE_KEY in src/i18n/config.ts.
      try {
        var saved = localStorage.getItem('masar-services.lang')
        var lang = saved === 'ar' || saved === 'en' ? saved : null
        if (!lang) {
          var langs = navigator.languages || [navigator.language]
          for (var i = 0; i < langs.length && !lang; i++) {
            var base = String(langs[i] || '').toLowerCase().split('-')[0]
            if (base === 'ar' || base === 'en') lang = base
          }
        }
        lang = lang || 'ar'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript. / يحتاج هذا الموقع إلى تفعيل JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
